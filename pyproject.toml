[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "icl_iwl"
version = "0.1.0"
description = "In-context vs in-weights learning in a small transformer (teaching exercise after Chan et al. 2022)"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "torchvision>=0.15", "matplotlib>=3.5", "numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["icl_iwl"]
